[project]
name = "hinga"
version = "0.1.0"
description = "A private journaling desk with schema-checked reflections and search over your own notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hinga*"]

[tool.setuptools.package-data]
hinga = ["static/*", "mindfulness/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
